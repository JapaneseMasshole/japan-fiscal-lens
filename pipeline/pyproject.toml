[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jfl-pipeline"
version = "0.1.0"
description = "Data pipeline for Japan Fiscal Lens: fetch, transform, validate and export official Japanese public-finance data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "olefile>=0.47",
  "xlrd>=2.0",  # legacy .xls (MIC FY2015 files)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jfl = "jfl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Official Japanese line names are kept verbatim, however long.
"src/jfl/transform/mof_flow_statements.py" = ["E501"]
"src/jfl/export/local_indicators.py" = ["E501"]
