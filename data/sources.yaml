# Catalog of every dataset used by Japan Fiscal Lens.
#
# Rules:
#   - Every chart on the site must reference one of these ids.
#   - `listing_url` is the official page that links to the files; fetchers
#     discover file links from it rather than hard-coding file URLs, because
#     ministries change file names between years.
#   - `verified` is the date a human last confirmed the URLs below work.
#
# Fields: id, level (national|local), publisher, title_ja, title_en,
#         statements, frequency, format, listing_url, notes, verified

sources:

  # ---------------------------------------------------------------- national
  - id: mof-fs
    level: national
    publisher: 財務省 (Ministry of Finance)
    title_ja: 国の財務書類（一般会計・特別会計／連結）
    title_en: National government financial statements (accrual basis)
    statements: [balance_sheet, operating_cost, net_asset_change, cash_flow_by_category]
    frequency: annual (published ~January, about 10 months after fiscal year end)
    format: xlsx, pdf
    listing_url: https://www.mof.go.jp/policy/budget/report/public_finance_fact_sheet/index.html
    year_pages:
      # Year pages are not named consistently, so they are listed explicitly.
      2024: https://www.mof.go.jp/policy/budget/report/public_finance_fact_sheet/fy2024/national/kuninozaimurenketu2024.html
      2023: https://www.mof.go.jp/policy/budget/report/public_finance_fact_sheet/fy2023/national/kuninozaimurenketu2023.html
      2022: https://www.mof.go.jp/policy/budget/report/public_finance_fact_sheet/fy2022/kuninozaimurenketu2022.html
      2021: https://www.mof.go.jp/policy/budget/report/public_finance_fact_sheet/fy2021/kuninozaimugassan2021.html
      2020: https://www.mof.go.jp/policy/budget/report/public_finance_fact_sheet/fy2020/kuninozaimurenketu2020.html
    variants:
      gassan: 一般会計・特別会計 合算 (general + special accounts)
      ippan: 一般会計のみ (general account only)
      renketsu: 連結 (consolidated with related public entities)
    notes: >
      Four statements: 貸借対照表, 業務費用計算書, 資産・負債差額増減計算書,
      区分別収支計算書. Years before FY2020 are archived at the National Diet
      Library (WARP).
    verified: 2026-09-26

  - id: mof-settlement
    level: national
    publisher: 財務省 (Ministry of Finance)
    title_ja: 財政統計（予算決算等データ）
    title_en: Fiscal statistics — general account budget and settlement time series (cash basis)
    statements: [revenue, expenditure]
    frequency: annual
    format: xlsx
    listing_url: https://www.mof.go.jp/policy/budget/reference/statistics/data.htm
    files:
      # Fixed file names that are overwritten with each update.
      table01: https://www.mof.go.jp/policy/budget/reference/statistics/01.xlsx  # 明治初年度以降 一般会計歳入歳出予算決算
      table04: https://www.mof.go.jp/policy/budget/reference/statistics/04.xlsx  # 昭和57年度以降 歳入主要科目別決算
      table06: https://www.mof.go.jp/policy/budget/reference/statistics/06.xlsx  # 明治初年度以降 歳出所管別決算
      table20: https://www.mof.go.jp/policy/budget/reference/statistics/20.xlsx  # 昭和42年度以降 主要経費別 歳出決算
    notes: >
      Cash-basis figures, the numbers most news coverage uses. Replaces the
      per-year 決算 pages, which only offer PDF.
    verified: 2026-09-26

  - id: boj-flow-of-funds
    level: national
    publisher: 日本銀行 (Bank of Japan)
    title_ja: 資金循環統計
    title_en: Flow of funds accounts (who holds government debt)
    statements: [debt_holders]
    frequency: quarterly
    format: csv, xlsx
    listing_url: https://www.boj.or.jp/statistics/sj/index.htm
    notes: Used for the holders of JGBs (BOJ, banks, insurers, households, overseas).
    verified: 2026-09-26

  - id: mof-jgb-holders
    level: national
    publisher: 財務省 (Ministry of Finance)
    title_ja: 国債等の保有者別内訳
    title_en: JGB holders breakdown (MOF summary of flow-of-funds data)
    statements: [debt_holders]
    frequency: quarterly
    format: pdf
    listing_url: https://www.mof.go.jp/jgbs/reference/appendix/index.htm
    notes: >
      PDF only, and the file name changes between releases (breakdown.pdf was
      replaced by holdings01.pdf), so always go through the listing page.
      Cross-check only; boj-flow-of-funds is the machine-readable source.
    verified: 2026-09-26

  - id: mof-debt-outstanding
    level: national
    publisher: 財務省 (Ministry of Finance)
    title_ja: 国債及び借入金並びに政府保証債務現在高
    title_en: Outstanding government bonds, borrowings and guaranteed debt
    statements: [debt]
    frequency: quarterly
    format: xlsx
    listing_url: https://www.mof.go.jp/jgbs/reference/gbb/data.htm
    verified: 2026-09-26

  # ------------------------------------------------------------------- local
  - id: mic-unified-fs
    level: local
    publisher: 総務省 (Ministry of Internal Affairs and Communications)
    title_ja: 統一的な基準による財務書類に関する情報
    title_en: Local government financial statements under the unified standard
    statements: [balance_sheet, administrative_cost, net_asset_change, cash_flow]
    frequency: annual (roughly 2 years' lag)
    format: xlsx (detailed, per prefecture incl. its municipalities), pdf (summary)
    listing_url: https://www.soumu.go.jp/iken/kokaikei/index.html
    year_pages:
      # Pattern: R{reiwa-year, 2 digits}_chihou_zaimusyorui.html
      # Older years are linked from kakomo_chihou_zaimusyorui.html.
      2023: https://www.soumu.go.jp/iken/kokaikei/R05_chihou_zaimusyorui.html
      2022: https://www.soumu.go.jp/iken/kokaikei/R04_chihou_zaimusyorui.html
      2019: https://www.soumu.go.jp/iken/kokaikei/R01_chihou_zaimusyorui.html
    past_years_page: https://www.soumu.go.jp/iken/kokaikei/kakomo_chihou_zaimusyorui.html
    notes: >
      Covers every prefecture and municipality in a common format, so local
      governments can be compared like-for-like. Also includes indicator
      lists (xlsx) for prefectures and municipalities. Each year page has one
      nationwide workbook plus one workbook per prefecture (incl. its
      municipalities); the fetcher downloads all of them. Add FY2020 and
      FY2021 pages from past_years_page.
    verified: 2026-09-26

  - id: mic-kessan-card-pref
    level: local
    publisher: 総務省 (Ministry of Internal Affairs and Communications)
    title_ja: 都道府県決算カード
    title_en: Prefecture settlement cards (cash basis)
    statements: [revenue, expenditure, fiscal_indicators]
    frequency: annual
    format: xlsx (FY2015+), pdf
    listing_url: https://www.soumu.go.jp/iken/zaisei/card.html
    notes: Excel from FY2015 (平成27年度) onward; earlier years are PDF only.
    verified: 2026-09-26

  - id: mic-kessan-card-muni
    level: local
    publisher: 総務省 (Ministry of Internal Affairs and Communications)
    title_ja: 市町村決算カード
    title_en: Municipality settlement cards (cash basis)
    statements: [revenue, expenditure, fiscal_indicators]
    frequency: annual
    format: xlsx, pdf
    listing_url: https://www.soumu.go.jp/iken/zaisei/card.html
    notes: >
      One page per year: card-{N}.html where N = fiscal year (Reiwa) + 19,
      e.g. FY2024 (R6) -> card-25.html, FY2023 (R5) -> card-24.html.
    verified: 2026-09-26

  - id: mic-fiscal-indicators
    level: local
    publisher: 総務省 (Ministry of Internal Affairs and Communications)
    title_ja: 地方公共団体の主要財政指標一覧
    title_en: Key fiscal indicators for every local government
    statements: [fiscal_indicators]
    frequency: annual
    format: xlsx (one file for all prefectures, one for all municipalities)
    listing_url: https://www.soumu.go.jp/iken/shihyo_ichiran.html
    year_pages:
      2022: https://www.soumu.go.jp/iken/zaisei/R04_chiho.html
    notes: >
      財政力指数, 経常収支比率, 実質公債費比率, 将来負担比率 and more, FY2003
      onward. Year page URLs are irregular (FY2024 lives under
      menu_seisaku/toukei/), so discover them from the listing page.
      The easiest first local dataset: two files cover the whole country.
    verified: 2026-09-26

  - id: mic-chihou-zaisei-chousa
    level: local
    publisher: 総務省 (Ministry of Internal Affairs and Communications)
    title_ja: 地方財政状況調査関係資料
    title_en: Local public finance survey (index page for the datasets above and more)
    statements: [revenue, expenditure, debt, fiscal_indicators]
    frequency: annual
    format: index page only
    listing_url: https://www.soumu.go.jp/iken/jokyo_chousa_shiryo.html
    notes: >
      No files on this page itself. Useful children: 決算カード (mic-kessan-card-*),
      主要財政指標一覧 (mic-fiscal-indicators), 財政状況資料集
      (iken/zaisei/jyoukyou_shiryou/index.html, detailed per-entity sheets),
      地方財政統計年報 (iken/zaisei/toukei.html, nationwide aggregates),
      基金残高等一覧 (iken/kikinzandaka.html, reserve funds).
    verified: 2026-09-26
